server:
  port: 8080

spring:
  application:
    name: gk-job-helper
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gk_job_helper?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: admin
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gk.jobhelper.entity
  configuration:
    map-underscore-to-camel-case: true

# Excel 原始文件保存目录（相对路径基于项目运行目录）
upload:
  dir: ./uploads
