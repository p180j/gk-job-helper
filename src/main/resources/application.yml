server:
  port: 8080

spring:
  application:
    name: gk-job-helper
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gk_job_helper?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: admin
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gk.jobhelper.entity
  configuration:
    map-underscore-to-camel-case: true

# Excel 原始文件保存目录（相对路径基于项目运行目录）
upload:
  dir: ./uploads

# 招聘 AI 文本补充是可选 fallback；未配置时始终保留规则解析结果，不会阻断公告自动处理。
# 请通过环境变量提供密钥，切勿提交到版本库。
recruitment:
  ai:
    provider: ${RECRUITMENT_AI_PROVIDER:}
    model: ${RECRUITMENT_AI_MODEL:}
    api-key: ${RECRUITMENT_AI_API_KEY:}
    base-url: ${RECRUITMENT_AI_BASE_URL:}
    timeout-ms: ${RECRUITMENT_AI_TIMEOUT_MS:15000}
